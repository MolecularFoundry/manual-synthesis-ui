substitutions:
  _IMAGE_PATH: "us-central1-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${REPO_NAME}-${BRANCH_NAME}"

steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: [-c, 'docker pull ${_IMAGE_PATH}:latest || exit 0']
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: [-c, 'docker build -t ${_IMAGE_PATH}:latest --cache-from ${_IMAGE_PATH}:latest .' ]
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_PATH}:latest' ]
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - -c
      - |
        if [ "${BRANCH_NAME}" = "main" ]; then
          gcloud run deploy manual-synthesis-ui-main \
            --image ${_IMAGE_PATH}:latest \
            --region us-central1 \
            --platform managed \
            --quiet \
            --update-env-vars DEBUG=true,RUN_ENV=cloud,PYTHON_UNBUFFERED=1 \
            --update-secrets ADMIN_APIKEY=perovskite-apps-crucible-apikey:latest,PROPDB_APIKEY=propdb-apikey:latest
        else
          echo "Branch '${BRANCH_NAME}' is not main; skipping Cloud Run deploy."
        fi

timeout: 600s
